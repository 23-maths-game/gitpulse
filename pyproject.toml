[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gitpulse"
version = "1.0.0"
description = "Zero-dependency git repository intelligence. Turns any git history into one self-contained interactive HTML report."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nova" }]
keywords = ["git", "analytics", "report", "cli", "zero-dependency", "devtools"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
gitpulse = "gitpulse.cli:main"

[project.urls]
Homepage = "https://github.com/your-username/gitpulse"

[tool.hatch.build.targets.wheel]
packages = ["gitpulse"]

[tool.ruff]
line-length = 100
target-version = "py310"
