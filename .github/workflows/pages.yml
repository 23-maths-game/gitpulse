name: Demo on GitHub Pages

# Publishes a live copy of the demo report so the README can link to something
# clickable. One-time setup: Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "gitpulse/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — gitpulse should analyse all of it

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e .

      - name: Build the site
        run: |
          mkdir -p _site
          # Live report of this repository itself.
          python -m gitpulse . -o _site/index.html -q
          # The committed demo pages, so the README links keep working.
          cp docs/demo-report.html _site/demo-report.html
          cp docs/demo-comparison.html _site/demo-comparison.html
          # .nojekyll keeps GitHub from running Jekyll over the HTML.
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
