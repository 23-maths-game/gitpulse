name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest -q

      - name: Smoke-test the CLI
        run: |
          python -m gitpulse . -o report.html --json metrics.json -q
          python -m gitpulse . --compare-to "1 year ago" -o compare.html -q
          python -m gitpulse . --include-bots -o with-bots.html -q

      - name: Prove the report is self-contained
        run: python -c "import pathlib,sys; h=pathlib.Path('report.html').read_text(); sys.exit(0 if '<script' not in h and 'http://' not in h and 'https://' not in h else 1)"

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          name: gitpulse-report
          path: |
            report.html
            metrics.json
          if-no-files-found: error
